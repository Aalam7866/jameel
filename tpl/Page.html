<!DOCTYPE html>
<html dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body { font-family: system-ui, Tahoma, sans-serif; margin: 0; padding: 14px; background: #f6f1e3; color: #222; }
  .card { max-width: 460px; margin: 0 auto 14px; background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 2px 10px #0002; }
  h1 { font-size: 22px; margin: 0; color: #8a6d00; }
  h3 { margin: 0 0 10px; }
  .me { float: left; width: 84px; height: 84px; object-fit: cover; border-radius: 50%; border: 3px solid #bf9000; margin: -4px 0 6px 10px; }
  .kind { display: inline-block; margin: 6px 0 14px; padding: 4px 12px; border-radius: 20px; background: #0b5d4b; color: #fff; font-weight: bold; }
  .item { margin-bottom: 10px; clear: both; }
  .row { display: flex; gap: 8px; }
  .row input { font-size: 22px; padding: 10px; border: 2px solid #bf9000; border-radius: 10px; text-align: center; min-width: 0; }
  .row .o { flex: 3; } .row .q { flex: 1; }
  .info { min-height: 20px; font-size: 15px; padding: 3px 4px 0; color: #555; }
  .info b { color: #0b5d4b; } .info.bad, .info.bad b { color: #b3261e; }
  .labels { display: flex; gap: 8px; color: #666; font-size: 14px; margin-bottom: 4px; clear: both; }
  .labels span:first-child { flex: 3; text-align: center; } .labels span:last-child { flex: 1; text-align: center; }
  button { font-size: 18px; width: 100%; padding: 14px; border: 0; border-radius: 10px; font-weight: bold; margin-top: 8px; }
  .add { background: #eee; color: #333; }
  .go { background: #0b5d4b; color: #fff; font-size: 21px; }
  .go:disabled { background: #999; }
  #msg { white-space: pre-line; margin-top: 12px; font-size: 16px; }
  .ok { color: #1a7f37; font-weight: bold; } .err { color: #b3261e; font-weight: bold; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  td { padding: 6px 4px; border-bottom: 1px solid #eee; text-align: center; }
  select { font-size: 18px; padding: 8px; width: 100%; border: 2px solid #bf9000; border-radius: 10px; background: #fff; margin-bottom: 12px; }
  .tiles { display: flex; gap: 8px; margin-bottom: 12px; }
  .tile { flex: 1; background: #f6f1e3; border-radius: 10px; padding: 8px 4px; text-align: center; }
  .tile b { display: block; font-size: 24px; color: #0b5d4b; } .tile.alt b { color: #b3261e; }
  .tile span { font-size: 13px; color: #555; }
  .sub { font-weight: bold; margin: 12px 0 4px; }
  .muted { color: #777; font-size: 14px; }
  .pin { font-size: 22px; padding: 10px; border: 2px solid #0b5d4b; border-radius: 10px; text-align: center; width: 100%; box-sizing: border-box; margin-top: 10px; }
  #waiting tr.w { cursor: pointer; } #waiting tr.w:active { background: #f6f1e3; }
  .fitbox { display: block; margin: 6px 2px 0; padding: 8px 10px; border-radius: 10px; background: #fff3cd; border: 2px solid #bf9000; font-size: 17px; font-weight: bold; }
  .fitbox input { width: 22px; height: 22px; vertical-align: middle; }
</style>
</head>
<body>
<? if (!ok) { ?>
  <div class="card"><h1>الرابط غير صالح</h1><p>Link not valid – please ask the shop for your personal link.</p></div>
<? } else { ?>
  <div class="card">
    <? if (photo) { ?><img class="me" src="<?!= photo ?>" alt=""><? } ?>
    <h1><?= name ?></h1>
    <div class="kind"><?= kind === 'CUT' ? 'قص – Cutting' : kind === 'HINGE' ? 'زرار – Hinge button' : kind === 'MEASURE' ? 'مقاس – Measuring' : kind === 'ARRIVE' ? 'الورشة – Arrived' : kind === 'EMBROIDERY' ? 'تطريز – Embroidery' : 'خياطة – Stitching' ?></div>
    <div class="labels"><span>رقم الطلب / Order No</span><span>العدد / Pcs</span></div>
    <div id="rows"></div>
    <button class="add" onclick="addRow()">+ سطر / Add row</button>
    <? if (needPin) { ?>
      <input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="الرقم السري / PIN">
    <? } ?>
    <button class="go" id="go" onclick="send()"><?= kind === 'ARRIVE' ? 'تم الوصول ✔ Arrived' : 'تحويل ◀ Transfer' ?></button>
    <div id="msg"></div>
  </div>
  <? if (kind === 'ARRIVE') { ?>
  <div class="card">
    <h3>لم تصل بعد / Not arrived yet</h3>
    <div class="muted">اضغط على الطلب لإضافته – tap an order to add it</div>
    <div id="waiting">…</div>
  </div>
  <? } ?>
  <div class="card">
    <h3>عملي اليوم / My work today</h3>
    <div id="today">…</div>
  </div>
  <div class="card">
    <h3>عملي الشهري / My work by month</h3>
    <div id="month">…</div>
  </div>
  <script>
    var TOKEN = <?= token ?>;
    var IS_ARRIVE = <?= kind === 'ARRIVE' ?>;
    var KIND = <?= kind ?>;
    var STATS = null;
    // the workshop: orders still to arrive; a tap puts the order and its pieces in the first empty row
    function showWaiting(list) {
      var el = document.getElementById('waiting');
      if (!el) return;
      if (!list || !list.length) { el.textContent = 'لا يوجد – nothing waiting'; return; }
      var h = '<table><tr><td><b>الطلب</b></td><td><b>المتبقي</b></td><td><b>الإجمالي</b></td></tr>';
      list.forEach(function (r) {
        h += '<tr class="w" data-o="' + esc(r.order) + '" data-q="' + esc(r.left) + '"><td>' + esc(r.order) + '</td><td>' + esc(r.left) + '</td><td>' + esc(r.total) + '</td></tr>';
      });
      el.innerHTML = h + '</table><div class="muted">' + list.length + ' طلب – orders</div>';
      el.querySelectorAll('tr.w').forEach(function (tr) {
        tr.addEventListener('click', function () { pick(tr.getAttribute('data-o'), tr.getAttribute('data-q')); });
      });
    }
    function pick(order, qty) {
      var items = document.querySelectorAll('#rows .item'), d = null;
      for (var i = 0; i < items.length; i++) if (!items[i].querySelector('.o').value.trim()) { d = items[i]; break; }
      if (!d) { addRow(); items = document.querySelectorAll('#rows .item'); d = items[items.length - 1]; }
      d.querySelector('.o').value = order;
      d.querySelector('.q').value = qty;
      lookup(d);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function loadWaiting() { if (IS_ARRIVE) google.script.run.withSuccessHandler(showWaiting).waiting(TOKEN); }
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
    function addRow() {
      var d = document.createElement('div');
      d.className = 'item';
      d.innerHTML = '<div class="row"><input class="o" inputmode="numeric" placeholder="رقم الطلب"><input class="q" inputmode="numeric" value="1"></div>' +
                    '<label class="fitbox" style="display:none"><input type="checkbox" class="fit"> <span></span></label>' +
                    '<div class="info"></div>';
      document.getElementById('rows').appendChild(d);
      var o = d.querySelector('.o'), q = d.querySelector('.q'), timer = null;
      o.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { lookup(d); }, 600); });
      o.addEventListener('change', function () { clearTimeout(timer); lookup(d); });
      q.addEventListener('input', function () { check(d); });
      d.querySelector('.fit').addEventListener('change', function () { check(d); });
    }
    // total and pieces left of the typed order (for this worker's kind of work)
    function lookup(d) {
      var info = d.querySelector('.info'), no = d.querySelector('.o').value.replace(/\D/g, '');
      d.data = null;
      var fb = d.querySelector('.fitbox');
      fb.style.display = 'none'; fb.querySelector('.fit').checked = false;
      if (!no) { info.className = 'info'; info.textContent = ''; return; }
      info.className = 'info'; info.textContent = '…';
      google.script.run.withSuccessHandler(function (r) {
        if (d.querySelector('.o').value.replace(/\D/g, '') !== no) return; // typed on meanwhile
        if (!r) { info.textContent = ''; return; }
        if (!r.found) { info.className = 'info bad'; info.textContent = 'غير موجود أو مكتمل – not found / finished'; return; }
        d.data = r;
        // fitting piece box: the master ticks "cut", the tailor "finished"
        if (r.fit === 'cut' || r.fit === 'done') {
          fb.style.display = '';
          fb.querySelector('span').textContent = r.fit === 'cut' ? 'قص البروفة ✂ Fitting piece cut' : 'البروفة جاهزة ✔ Fitting piece finished';
        }
        // a tailor can stitch only what is cut: nothing cut yet → pieces 0 (the fitting piece can still be ticked)
        if (KIND === 'STITCH' && r.cutAvail <= 0) d.querySelector('.q').value = '0';
        check(d);
      }).withFailureHandler(function () { info.textContent = ''; }).orderInfo(TOKEN, no);
    }
    function check(d) {
      var r = d.data, info = d.querySelector('.info');
      if (!r) return;
      var q = parseInt(d.querySelector('.q').value, 10) || 0;
      var fitOn = d.querySelector('.fit').checked;
      var pcs = q + (fitOn ? 1 : 0);   // the fitting piece counts as one piece
      var tailor = KIND === 'STITCH';
      var notCut = tailor && pcs > r.cutAvail && pcs <= r.left;   // more than the masters have cut
      var bad = pcs > r.left || notCut;
      info.className = bad ? 'info bad' : 'info';
      info.innerHTML = 'الإجمالي <b>' + r.total + '</b> – المتبقي <b>' + r.left + '</b>' +
                       '&nbsp;&nbsp;|&nbsp;&nbsp;Total <b>' + r.total + '</b> – Left <b>' + r.left + '</b>' +
                       (fitOn ? '<br>+1 بروفة – the fitting piece counts as 1 pc' : '') +
                       (pcs > r.left ? '<br>أكثر من المتبقي – more than left' : '') +
                       (tailor ? '<br>المقصوص الجاهز للخياطة <b>' + r.cutAvail + '</b> – cut, ready to stitch <b>' + r.cutAvail + '</b>' : '') +
                       (notCut ? '<br><b>المقصوص ' + r.cutAvail + ' فقط – only ' + r.cutAvail + ' pcs cut</b>' : '') +
                       (r.fit === 'waitcut' ? '<br>البروفة لم تُقص بعد – fitting piece not cut yet' : '');
    }
    function showToday(list) {
      var el = document.getElementById('today');
      if (!list || !list.length) { el.textContent = 'لا يوجد – nothing yet'; return; }
      var total = 0, h = '<table><tr><td><b>الوقت</b></td><td><b>الطلب</b></td><td><b>العدد</b></td></tr>';
      list.forEach(function (r) {
        total += Number(r.qty);
        // the fitting piece is one of the pieces: "2 + بروفة" = 3 pcs, "بروفة" = 1 pc
        var shown = r.fit ? (r.qty - 1 > 0 ? (r.qty - 1) + ' + بروفة' : 'بروفة') : r.qty;
        h += '<tr><td>' + esc(r.time) + '</td><td>' + esc(r.order) + '</td><td>' + esc(shown) + '</td></tr>';
      });
      el.innerHTML = h + '<tr><td></td><td><b>المجموع / Total</b></td><td><b>' + total + '</b></td></tr></table>';
    }
    // ---- my work by month (summary made by the shop app, updated every few minutes)
    function monthName(ym) {
      var names = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
      var p = ym.split('-');
      return names[parseInt(p[1], 10) - 1] + ' ' + p[0];
    }
    function money(v) { return (Number(v) || 0).toFixed(2) + ' ر.س.'; }
    function showStats(s) {
      STATS = s || { months: [], work: [], alts: [] };
      var el = document.getElementById('month');
      if (!STATS.months.length) { el.textContent = 'لا يوجد بعد – nothing yet'; return; }
      var tp = 0, ta = 0, te = 0;
      STATS.months.forEach(function (m) { tp += Number(m[1]); ta += Number(m[3]); te += Number(m[5] || 0); });
      var h = '<select id="ym" onchange="showMonth()"><option value="">المجموع (12 شهر) – Total 12 months</option>';
      STATS.months.forEach(function (m, i) { h += '<option value="' + esc(m[0]) + '"' + (i === 0 ? ' selected' : '') + '>' + esc(monthName(m[0])) + '</option>'; });
      h += '</select><div id="mdetail"></div>' +
           '<div class="muted">المجموع 12 شهر: ' + tp + ' قطعة – ' + ta + ' تعديل' + (te > 0 ? ' – ' + money(te) : '') +
           ' &nbsp;|&nbsp; 12 months: ' + tp + ' pcs – ' + ta + ' alts' + (te > 0 ? ' – ' + money(te) : '') + '</div>';
      el.innerHTML = h;
      showMonth();
    }
    function showMonth() {
      var ym = document.getElementById('ym').value, el = document.getElementById('mdetail');
      var pcs = 0, orders = 0, alts = 0, earn = 0;
      STATS.months.forEach(function (m) { if (!ym || m[0] === ym) { pcs += Number(m[1]); orders += Number(m[2]); alts += Number(m[3]); earn += Number(m[5] || 0); } });
      var h = '<div class="tiles"><div class="tile"><b>' + pcs + '</b><span>قطعة / pcs</span></div>' +
              '<div class="tile"><b>' + orders + '</b><span>طلب / orders</span></div>' +
              (earn > 0 ? '<div class="tile"><b>' + money(earn) + '</b><span>الأجر / earned</span></div>' : '') +
              '<div class="tile alt"><b>' + alts + '</b><span>تعديل / alts</span></div></div>';
      if (!ym) {
        h += '<table><tr><td><b>الشهر</b></td><td><b>قطع</b></td><td><b>طلبات</b></td>' + (earn > 0 ? '<td><b>الأجر</b></td>' : '') + '<td><b>تعديلات</b></td></tr>';
        STATS.months.forEach(function (m) { h += '<tr><td>' + esc(monthName(m[0])) + '</td><td>' + esc(m[1]) + '</td><td>' + esc(m[2]) + '</td>' + (earn > 0 ? '<td>' + money(m[5]) + '</td>' : '') + '<td>' + esc(m[3]) + '</td></tr>'; });
        h += '</table>';
      } else {
        var work = STATS.work.filter(function (w) { return String(w[0]).slice(0, 7) === ym; });
        if (work.length) {
          h += '<div class="sub">عملي / My work</div><table><tr><td><b>التاريخ</b></td><td><b>الطلب</b></td><td><b>العدد</b></td></tr>';
          work.forEach(function (w) { h += '<tr><td>' + esc(String(w[0]).slice(5).split('-').reverse().join('-')) + '</td><td>' + esc(w[1]) + '</td><td>' + esc(w[2]) + '</td></tr>'; });
          h += '</table>';
        } else if (pcs > 0) {
          h += '<div class="muted">التفاصيل متاحة لآخر 3 أشهر فقط – details only for the last 3 months</div>';
        }
        var alts2 = STATS.alts.filter(function (a) { return String(a[0]).slice(0, 7) === ym; });
        if (alts2.length) {
          h += '<div class="sub">تعديلاتي / My alterations</div><table><tr><td><b>التاريخ</b></td><td><b>رقم التعديل</b></td><td><b>الطلب</b></td><td><b>العدد</b></td><td><b>الحالة</b></td></tr>';
          alts2.forEach(function (a) {
            var st = { Pending: 'قيد الانتظار', Ready: 'جاهز', Delivered: 'تم التسليم' }[a[4]] || a[4];
            h += '<tr><td>' + esc(String(a[0]).slice(5).split('-').reverse().join('-')) + '</td><td>' + esc(a[1]) + '</td><td>' + esc(a[2] || '-') + '</td><td>' + esc(a[3]) + '</td><td>' + esc(st) + '</td></tr>';
          });
          h += '</table>';
        }
      }
      el.innerHTML = h;
    }
    function send() {
      var rows = [];
      document.querySelectorAll('#rows .item').forEach(function (r) {
        var o = r.querySelector('.o').value.trim(), q = r.querySelector('.q').value.trim();
        if (o) rows.push({ order: o, qty: q, fit: r.querySelector('.fit').checked });
      });
      var msg = document.getElementById('msg'), go = document.getElementById('go'), pinEl = document.getElementById('pin');
      if (!rows.length) { msg.className = 'err'; msg.textContent = 'اكتب رقم الطلب – enter the order number'; return; }
      if (pinEl && !pinEl.value.trim()) { msg.className = 'err'; msg.textContent = 'اكتب الرقم السري – enter your PIN'; pinEl.focus(); return; }
      go.disabled = true; msg.className = ''; msg.textContent = '…';
      google.script.run
        .withSuccessHandler(function (r) {
          go.disabled = false;
          msg.className = r.ok ? 'ok' : 'err';
          msg.textContent = r.msg;
          if (r.ok) {
            document.getElementById('rows').innerHTML = '';
            addRow(); addRow(); addRow();
            showToday(r.today);
            loadWaiting();
          } else if (r.pin && pinEl) { pinEl.value = ''; pinEl.focus(); }
        })
        .withFailureHandler(function () {
          go.disabled = false; msg.className = 'err';
          msg.textContent = 'لا يوجد اتصال، حاول مرة أخرى – No connection, try again';
        })
        .submit(TOKEN, rows, pinEl ? pinEl.value : '');
    }
    addRow(); addRow(); addRow();
    loadWaiting();
    google.script.run.withSuccessHandler(showToday).myToday(TOKEN);
    google.script.run.withSuccessHandler(showStats).myStats(TOKEN);
  </script>
<? } ?>
</body>
</html>
