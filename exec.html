<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>…</title>
<link rel="icon" href="/favicon.svg">
<meta name="theme-color" content="#0e6b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/img/icon-192.png">
<style>body{font-family:system-ui,Tahoma,sans-serif;background:#f6f1e3;color:#555;display:grid;place-items:center;min-height:90vh;margin:0}</style>
</head>
<body>
<p id="w">… جاري التحميل – Loading</p>
<script type="module">
// JAMEEL AL HINDAM online pages:  /exec?t=TOKEN (worker)  /exec?o=KEY (new order)  /exec?a=KEY (alerts)
// The same Page/Order/Admin pages as before; their google.script.run calls now go to Firebase (js/jameel.js).
import { SERVER, pageVars, orderVars, adminVars } from '/js/jameel.js?v=11';

// google.script.run → Firebase
const SHIM = `<script>(function () {
  function R(ok, bad) {
    return new Proxy({}, { get: function (_, n) {
      if (n === 'withSuccessHandler') return function (h) { return R(h, bad); };
      if (n === 'withFailureHandler') return function (h) { return R(ok, h); };
      if (n === 'withUserObject') return function () { return R(ok, bad); };
      return function () {
        var a = [].slice.call(arguments);
        window.__srv.then(function (S) { if (!S[n]) throw new Error('unknown ' + n); return S[n].apply(null, a); })
          .then(function (r) { if (ok) ok(r); }, function (e) { console.error(e); if (bad) bad(e); });
      };
    } });
  }
  window.google = { script: { run: R(null, null) } };
})();<\/script>`;

// Each page has its own address – /a/KEY/ (admin), /o/KEY/ (new order), /t/TOKEN/ (work entry) – so each installed app has
// its own scope and Android opens a link in its own app. An old /exec?a=KEY link moves to its address.
const P = new URLSearchParams(location.search);
const ROUTE = location.pathname.match(/^\/(a|o|t)\/([0-9a-f]{32})\/?$/);
const OLD = ROUTE ? null : ['a', 'o', 't'].find(k => /^[0-9a-f]{32}$/.test(P.get(k) || ''));
const KIND = ROUTE ? ROUTE[1] : OLD || (P.get('o') ? 'o' : P.get('a') ? 'a' : 't');
const KEYV = ROUTE ? ROUTE[2] : P.get(KIND);
const HOME = location.origin + '/' + KIND + '/' + KEYV + '/';
let tpl, vars, title;
if (OLD) location.replace(HOME);
else try {
  if (KIND === 'o') { tpl = 'Order'; vars = await orderVars(KEYV); title = 'طلب جديد – New order'; }
  else if (KIND === 'a') { tpl = 'Admin'; vars = await adminVars(KEYV); title = 'إدارة – Admin'; }
  else { tpl = 'Page'; vars = await pageVars(KEYV); title = (vars.ok && vars.name) ? vars.name + ' – جميل' : 'Work entry'; }
  // PWA: set manifest with current URL as start_url so each page installs as its own app
  const wName = (tpl === 'Page' && vars.ok && vars.name) ? vars.name : '';
  const mani = { name: wName ? wName + ' – جميل الهندام' : 'جميل الهندام – ' + title,
    short_name: wName || (tpl === 'Admin' ? 'Jameel Admin' : tpl === 'Order' ? 'Jameel Order' : 'Jameel'),
    start_url: HOME, scope: HOME, id: HOME, display: 'standalone',
    background_color: '#eef5f3', theme_color: '#0e6b5c', orientation: 'portrait',
    icons: [{ src: location.origin + '/img/icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
            { src: location.origin + '/img/icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any maskable' }] };
  const mLink = '<link rel="manifest" href="' + URL.createObjectURL(new Blob([JSON.stringify(mani)], { type: 'application/json' })) + '">';
  const src = await (await fetch('/tpl/' + tpl + '.html?v=5', { cache: 'no-cache' })).text();
  window.__srv = Promise.resolve(SERVER);
  const html = render(src, vars)
    .replace('<head>', '<head>\n<meta name="viewport" content="width=device-width, initial-scale=1"><title>' + esc(title) + '</title><link rel="icon" href="/favicon.svg">' + mLink + SHIM);
  document.open(); document.write(html); document.close();
} catch (e) {
  console.error(e);
  document.getElementById('w').textContent = 'لا يوجد اتصال – No connection, try again (' + (e && e.message || e) + ')';
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// Apps Script template: <? code ?>  <?= value ?> (escaped – a JS literal inside <script>)  <?!= raw ?>
function render(src, v) {
  const parts = src.split(/<\?(!=|=)?([\s\S]*?)\?>/);
  let code = 'let __o = "";\n';
  let inScript = false;
  for (let i = 0; i < parts.length; i += 3) {
    const text = parts[i];
    if (text) {
      code += '__o += ' + JSON.stringify(text) + ';\n';
      const a = text.lastIndexOf('<script'), b = text.lastIndexOf('</script');
      if (a > b) inScript = true; else if (b > a) inScript = false;
    }
    const mode = parts[i + 1], body = parts[i + 2];
    if (body === undefined) continue;
    if (mode === '=') code += '__o += ' + (inScript ? '__js' : '__h') + '((' + body + '));\n';
    else if (mode === '!=') code += '__o += String((' + body + ') ?? "");\n';
    else code += body + '\n';
  }
  code += 'return __o;';
  const names = Object.keys(v);
  const fn = new Function('__h', '__js', ...names, code);
  return fn(esc, (x) => JSON.stringify(x === undefined ? null : x).replace(/</g, '\\u003c'), ...names.map(k => v[k]));
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
